name: Android
on:
  push: {}
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: android-${{ github.ref }}, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: aura-mirage-debug, path: app/build/outputs/apk/debug/app-debug.apk, retention-days: 14 }
